name: Vérifications Windows
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-finance-rust-${{ hashFiles('src-tauri/Cargo.toml') }}
      - run: npm install
      - run: python -m pip install openpyxl==3.1.5
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: source-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
      - run: python -B -m unittest discover -s tests -p test_audit_excel.py
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: gestion-financiere-windows
          path: src-tauri/target/release/gestion-financiere.exe
          if-no-files-found: error
      - run: npm run tauri -- bundle --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-gestion-financiere-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Tester l'installation Windows
        shell: pwsh
        run: ./tests/windows-installer.ps1
