name: Vérifications Windows
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup default stable
      - run: npm install
      - run: npm test
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: gestion-financiere-windows
          path: src-tauri/target/release/gestion-financiere.exe
          if-no-files-found: error
